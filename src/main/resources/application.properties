spring.application.name=cafeteria

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# REMOVA ou comente as linhas de baseline para que o Flyway rode a partir da V1
# spring.flyway.baseline-on-migrate=true
# spring.flyway.baseline-version=2

# Mantido se você usa data.sql ou herança de inicialização específica
spring.jpa.defer-datasource-initialization=true

# Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração de conexão do Banco (Adicione se não estiver em outro profile)
spring.datasource.url=jdbc:postgresql://localhost:5432/cafeteria
spring.datasource.username=postgres
spring.datasource.password=sua_senha_aqui

# Perfil padrão
spring.profiles.default=dev
debug=true
